name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install ".[dev]" build
      - name: Run tests
        run: python -m pytest -q
      - name: Check source and test code
        run: python -m ruff check src tests
      - name: Build distribution
        run: python -m build

  web:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
      OPENX_PYTHON: python
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the package
        run: python -m pip install ..
      - name: Install web dependencies
        run: npm ci
      - name: Web types match the API document
        run: npm run gen:api && git diff --exit-code src/api-types.ts
      - name: Type-check and build the web interface
        run: npm run build
      - name: Install the browser for UI checks
        # A stalled download fails here instead of holding the run for the 6-hour default.
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium
      - name: UI checks on the authored demo workspace
        run: npm run verify:ui
      - name: Keep the UI check output on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-ui
          path: web/.verify-out/ui
          if-no-files-found: ignore
